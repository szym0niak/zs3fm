	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: #111;
			color: black;
			font-family: Arial, sans-serif;
		}

		.gallery-container {
			max-width: 700px;
			margin: 0 auto;
			padding: 12px;
		}

		.gallery {
			columns: 2;
			column-gap: 10px;
		}

		.photo {
			display: inline-block;
			width: 100%;
			margin-bottom: 10px;
			break-inside: avoid;
			cursor: pointer;
		}

		.photo img {
			display: block;
			width: 100%;
			height: auto;
		}

		@media (min-width: 701px) {
			.gallery-container {
				max-width: 900px;
				padding: 20px;
			}

			.gallery {
				column-gap: 16px;
			}

			.photo {
				margin-bottom: 16px;
			}
		}
	</style>
</head>
