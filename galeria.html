<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: #111;
			color: black;
			font-family: Arial, sans-serif;
		}
		
		.gallery-description {
			font-family: monospace;
			font-size: 16px;
			line-height: 1.2;
			margin: 1;
			text-align: left;
		}

		.gallery-container {
			max-width: 700px;
			margin: 0 auto;
			padding: 0;
		}

		.gallery {
			columns: 2;
			column-gap: 8px;
		}

		.photo {
			display: inline-block;
			width: 100%;
			margin-bottom: 4px;
			break-inside: avoid;
			cursor: pointer;
		}

		.photo img {
			display: block;
			width: 100%;
			height: auto;
		}

		@media (min-width: 701px) {
			.gallery-container {
				max-width: 900px;
				padding: 20px;
			}

			.gallery {
				column-gap: 16px;
			}

			.photo {
				margin-bottom: 16px;
			}
		}
	</style>
</head>

<body style="background-color:lightseagreen">

	<main class="gallery-container">

	<p class="gallery-description">
